# Local test override for docker-compose.prod.yml: build the app images from
# CURRENT source (not the released :1.24.0) and use Caddy internal TLS with
# *.localhost so the prod topology is exercised without ACME or a real domain.
# Because each service keeps its base `image:` name AND gains a `build:`,
# `docker compose ... up --build` builds from source and tags it as that image.
# Used by scripts/smoke-prod.sh:
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod-smoke.yml up --build
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
  portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.portal
  caddy:
    # Only the Caddyfile mount differs from the base (internal TLS instead of
    # ACME); the base's caddy-data/caddy-config volumes are kept by the merge.
    volumes:
      - ./caddy/Caddyfile.smoke:/etc/caddy/Caddyfile:ro
