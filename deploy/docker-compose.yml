# Fixed project name so containers/networks are `orbeat-*` regardless of the
# compose file's directory (which otherwise names the project "deploy").
name: orbeat

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbeat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbeat}
      POSTGRES_DB: ${POSTGRES_DB:-orbeat}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # -h 127.0.0.1 forces a TCP probe. During initdb Postgres opens a
      # temporary server on the UNIX SOCKET ONLY; a socket pg_isready answers UP
      # in that window before the real server is listening on TCP (the compose
      # equivalent of the "don't wait only on the port" testcontainers gotcha).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbeat} -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Canonical public (browser-facing) URL — all tokens carry this as `iss`.
      # The portal and host browser reach Keycloak at http://localhost:8088 and
      # receive tokens with iss=http://localhost:8088/realms/orbeat.
      KC_HOSTNAME: "http://localhost:8088"
      # Allow requests from other hostnames (e.g. keycloak:8080 from containers)
      # while still issuing the canonical public issuer URL above.
      KC_HOSTNAME_STRICT: "false"
      # Let Keycloak derive backchannel (container-to-container) endpoints from
      # the incoming request URL instead of the public KC_HOSTNAME. This means
      # the discovery doc's jwks_uri will resolve to keycloak:8080 when fetched
      # from inside the Docker network — reachable by api/gateway containers.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Enable the KC management health endpoint on port 9000 (KC 26+).
      KC_HEALTH_ENABLED: "true"
    volumes:
      # Bind ONLY the dev realm file (not the whole deploy/keycloak/ directory) —
      # `--import-realm` auto-imports every *.json it finds under the mount, and
      # both this file and the committed orbeat-realm.prod.json declare
      # "realm": "orbeat"; mounting the directory let Keycloak import whichever
      # file it read first and silently skip the other (import order is
      # filesystem-dependent, not alphabetical), which can leave the stack
      # bootstrapped from the wrong realm (e.g. the prod template's zero users).
      - ./keycloak/orbeat-realm.json:/opt/keycloak/data/import/orbeat-realm.json:ro
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      # KC 26 exposes a management API on port 9000. GET /health/ready returns
      # {"status":"UP",...} when Keycloak is fully initialised (realm import done).
      # The image has no curl/wget; we use /dev/tcp for a raw HTTP GET and pipe
      # stdout directly into grep — no shell variable needed, avoiding YAML
      # interpolation of $ signs in block scalars.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\": *\"UP\"' <&3"]
      interval: 5s
      timeout: 10s
      retries: 40

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      ORBEAT_HTTP_ADDR: ":8080"
      ORBEAT_DB_URL: "postgres://${POSTGRES_USER:-orbeat}:${POSTGRES_PASSWORD:-orbeat}@postgres:5432/${POSTGRES_DB:-orbeat}?sslmode=disable"
      # Tokens carry iss=localhost:8088 (browser-facing public issuer).
      ORBEAT_OIDC_ISSUER: "http://localhost:8088/realms/orbeat"
      ORBEAT_OIDC_AUDIENCE: "orbeat-api"
      # Fetch OIDC discovery + JWKS from keycloak:8080 (container-reachable).
      # With KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true the discovery doc served at
      # keycloak:8080 returns jwks_uri pointing at keycloak:8080 — reachable here.
      ORBEAT_OIDC_DISCOVERY_URL: "http://keycloak:8080/realms/orbeat"
      ORBEAT_CORS_ORIGINS: "http://localhost:8081,http://localhost:5173"
      # Marketplace git target: in-container ephemeral path writable by the
      # nonroot (uid 65532) distroless image. /tmp is world-writable; no volume
      # or bind-mount needed. On every artifact mutation the publisher commits
      # the rendered tree here in local-commit mode (no remote credentials).
      # Extract to host with:
      #   docker compose -f deploy/docker-compose.yml cp api:/tmp/orbeat-marketplace ./orbeat-marketplace-published
      ORBEAT_MARKETPLACE_GIT_URL: "/tmp/orbeat-marketplace"
      ORBEAT_GATEWAY_RESOURCE_URL: "http://localhost:8090"
      # Per-principal rate limiting (docs/specs/2026-08-12-orbeat-rate-limiting-design.md).
      # The production default (rps=50, burst=200, cmd/api/main.go) is sized
      # for one interactive admin. This override exists only because THIS
      # stack also backs `make smoke` and the portal e2e suite, whose seeding
      # traffic is a short structural spike rather than anything a human does.
      #
      # BACK TO 1000 on 2026-08-27, and the reason is that the premise of the
      # previous derivation stopped being true the same day. That derivation
      # measured 793 requests on ONE bucket because nearly every spec in
      # portal/e2e authenticated as "boss", and internal/ratelimit.KeyFor keys
      # on subject+client, so fourteen spec files shared a single bucket. The
      # five seeding-heavy specs now each have their own Keycloak identity
      # (deploy/keycloak/orbeat-realm.json, gated by
      # internal/deploy/e2e_identity_test.go), so that one bucket no longer
      # exists and 1600 was sized for a condition that is gone.
      #
      # Measured after the split, from the api container's own request logs
      # over a full 32-spec run on a fresh stack, grouped by identity:
      # e2e-pagination 552, e2e-sortsearch 217, boss 128, boss2 72,
      # e2e-concurrency 34, e2e-roles 28, e2e-auditfilters 10, alice 6.
      # All 969 of those were one bucket before the split.
      #
      # BE PRECISE ABOUT WHAT 552 IS. It is counted per SUBJECT, which merges
      # this user's browser client (orbeat-portal) and its direct-seeding
      # client (orbeat-cli) even though those are two separate buckets. So 552
      # is an UPPER BOUND on any single bucket, not a measurement of one. The
      # refill-aware minimum was NOT re-derived here: the previous round
      # replayed captured arrival timestamps through the real token-bucket
      # semantics to get 533 against a raw 793, and no equivalent replay was
      # run this time.
      #
      # 1000 is justified without that replay, by comparison rather than by a
      # fresh model: 1000 previously absorbed a raw 793 on a single bucket
      # across six full-suite runs with ZERO 429s observed, and the new raw
      # upper bound per bucket is 552. Strictly less demand against the same
      # depth means strictly more headroom than it had when it was already
      # sufficient. rps stays at the production default, because the excess is
      # a spike over roughly 5 seconds, not sustained load above 50/s.
      #
      # No 429 has ever been observed here, at 1000 or at 1600. That is worth
      # stating plainly: this limit has not been seen to trip, and the 1600
      # raise was precautionary rather than a fix for anything reproduced.
      #
      # If a new spec starts flaking here, first check it has its own identity
      # (the gate above enforces that for specs defining a local adminToken),
      # then re-derive the counts. Do not "fix" it by slowing the tests.
      ORBEAT_RATELIMIT_BURST: "1000"
      # Unset (the default) resolves to "", which internal/config treats as
      # "OTel disabled" — no-op providers, zero overhead, exactly as before.
      # Set it to otel-collector:4317 alongside `--profile observability` to
      # turn export on. Starting the collector alone does nothing: compose
      # profiles gate SERVICES, not variables on other services.
      ORBEAT_OTEL_ENDPOINT: ${ORBEAT_OTEL_ENDPOINT:-}
      # Artifact revision pruning cap (docs/specs/2026-08-19-orbeat-revision-pruning-design.md).
      # Unset (the default) resolves to "", which internal/config treats as
      # "no pruning" (config.ArtifactRevisionKeepN). Do NOT hard-code a value
      # here: this compose file also backs `make up` and the Playwright e2e
      # job, and portal/e2e/approval.spec.ts approves an artifact twice then
      # rolls back to revision 1 — a hard-coded cap of 2 would survive with
      # zero margin (revision 1 pruned by the rollback's own insert), silently
      # breaking that governance gate for a cause nobody would connect to this
      # variable. scripts/smoke.sh exports its own value before bringing the
      # stack up, exercising the cap without touching make up/e2e.
      ORBEAT_ARTIFACT_REVISION_KEEP: ${ORBEAT_ARTIFACT_REVISION_KEEP:-}
      # Artifact deployment registry (docs/specs/2026-08-22-orbeat-artifact-
      # deployment-registry-design.md). Unset (the default) resolves to "",
      # which config.DeploymentRegistryEnabled reads as OFF: no report route is
      # registered and /v1/sync/config advertises deploymentRegistry false, so
      # `make up` and the Playwright e2e job collect nothing about anybody.
      # Do NOT hard-code a value here. This knob turns on per-developer
      # collection, and the one place it may default to on is nowhere.
      # scripts/smoke.sh exports "true" before bringing the stack up, because
      # its binary gate is the only place a client report can be observed end
      # to end (spec sec 15, G1).
      ORBEAT_DEPLOYMENT_REGISTRY: ${ORBEAT_DEPLOYMENT_REGISTRY:-}
      # Advisory LLM content scanner, pointed at the fake-llm service below.
      #
      # HARD-CODED ON, where ORBEAT_OTEL_ENDPOINT / _ARTIFACT_REVISION_KEEP /
      # _DEPLOYMENT_REGISTRY above are deliberately left as unset
      # passthroughs. The difference is what the knob turns on. Those three
      # change what the product does to real operators and real developers, so
      # their default is off. This one points at a fixture that exists only in
      # this file, and its whole purpose is that the code path runs on every
      # `make up`, `make smoke` and Playwright run rather than never running
      # anywhere: an off default would reproduce the situation this was added
      # to fix.
      #
      # WHAT THIS DOES NOT ESTABLISH: fake-llm's findings are canned, so a
      # green run here is coverage of the path and nothing more. It is not
      # evidence about a real model's false-positive rate, and so not an input
      # to whether an LLM finding may ever block a submit.
      #
      # In a Community build this is inert: the generator drops
      # cmd/api/scanner_enterprise.ee.go and the no-op counterpart ignores
      # every ORBEAT_SCAN_LLM_* value, so fake-llm sits idle and the rule
      # scanner runs alone, exactly as before.
      ORBEAT_SCAN_LLM_ENDPOINT: "http://fake-llm:9100"
      ORBEAT_SCAN_LLM_PROVIDER: "openai"
      ORBEAT_SCAN_LLM_MODEL: "fake-llm-dev"
      # The key ref is resolved fail-closed at startup (internal/secrets), so
      # this pair covers the real resolution path rather than skipping it: an
      # unset or empty ORBEAT_FAKE_LLM_KEY aborts cmd/api instead of quietly
      # sending an empty bearer token. The value is not a secret and is not
      # checked by fake-llm, which only asserts that SOME key arrived.
      ORBEAT_SCAN_LLM_KEY_REF: "env:ORBEAT_FAKE_LLM_KEY"
      ORBEAT_FAKE_LLM_KEY: "dev-fake-llm-key-not-a-secret"
    ports:
      - "127.0.0.1:8080:8080"
    # Self-probe healthcheck: the distroless image has no shell/curl, so the
    # binary probes its own /healthz (reads ORBEAT_HTTP_ADDR). This makes
    # `depends_on: service_healthy` meaningful for the portal below.
    healthcheck:
      test: ["CMD", "/orbeat-api", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # service_healthy, not service_started, and the reason is the scanner's
      # fail-open contract: if a scan cannot reach its endpoint it returns an
      # "info" finding rather than an error. An api that started ahead of
      # fake-llm would therefore not fail, it would silently attach a finding
      # to any artifact submitted in that window, suspending trusted-author
      # auto-approval for reasons no test would connect to a startup race.
      fake-llm:
        condition: service_healthy

  upstream:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.upstream
    ports:
      - "127.0.0.1:9000:9000"

  # Stand-in LLM endpoint for the advisory content scanner. Full rationale,
  # including the sentinel and why it flags nothing else, is in
  # deploy/fakellm/main.go; the api's ORBEAT_SCAN_LLM_* block above points at
  # it.
  #
  # Deliberately publishes NO host port. Nothing on the host calls it: the api
  # reaches it by compose service name, and the evidence that it ran is its own
  # log line (`docker compose -f deploy/docker-compose.yml logs fake-llm`,
  # one "fakellm: scan ..." line per artifact submit), which is better proof
  # than a port anyone could curl.
  #
  # Deliberately NOT behind a compose profile either, and that is not an
  # oversight. Profiles gate services, not the variables on other services, so
  # a profiled fake-llm plus a hard-coded ORBEAT_SCAN_LLM_ENDPOINT on api would
  # leave the default stack scanning against a service that is not running.
  # The scanner fails OPEN, so that would not error: it would attach an "info"
  # finding to every single submit, which is exactly the outcome the sentinel
  # design exists to avoid.
  fake-llm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.fakellm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/fakellm", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    restart: unless-stopped
    environment:
      # NOTE: the gateway listens on :8090 (its own port, distinct from the api's
      # :8080). The published port below maps host 8090 -> container 8090.
      ORBEAT_HTTP_ADDR: ":8090"
      ORBEAT_DB_URL: "postgres://${POSTGRES_USER:-orbeat}:${POSTGRES_PASSWORD:-orbeat}@postgres:5432/${POSTGRES_DB:-orbeat}?sslmode=disable"
      # Tokens carry iss=localhost:8088 (browser-facing public issuer).
      ORBEAT_OIDC_ISSUER: "http://localhost:8088/realms/orbeat"
      # The gateway is a distinct OAuth 2.1 resource server (RFC 8707 audience).
      ORBEAT_OIDC_AUDIENCE: "orbeat-gateway"
      # Fetch OIDC discovery + JWKS from keycloak:8080 (container-reachable).
      ORBEAT_OIDC_DISCOVERY_URL: "http://keycloak:8080/realms/orbeat"
      ORBEAT_TENANT_NAME: "default"
      ORBEAT_GATEWAY_RESOURCE_URL: "http://localhost:8090"
      # Unset (the default) resolves to "", which internal/config treats as
      # "OTel disabled" — no-op providers, zero overhead, exactly as before.
      # Set it to otel-collector:4317 alongside `--profile observability` to
      # turn export on. Starting the collector alone does nothing: compose
      # profiles gate SERVICES, not variables on other services.
      ORBEAT_OTEL_ENDPOINT: ${ORBEAT_OTEL_ENDPOINT:-}
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "/orbeat-gateway", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      upstream:
        condition: service_started
      # Same reason as the prod stack: orbeat-api is the only service that runs
      # migrations, and the gateway reads that schema directly. Without this edge
      # the gateway can start against a not-yet-migrated database.
      api:
        condition: service_healthy

  portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.portal
    restart: unless-stopped
    environment:
      ORBEAT_HTTP_ADDR: ":8081"
      # CSP connect-src origins the SPA is allowed to call from the browser:
      # api (:8080), Keycloak (:8088), gateway (:8090). REQUIRED — without it
      # the portal's CSP is 'self'-only and the browser blocks all API/OIDC
      # calls. Must match the VITE_* origins baked into the portal image.
      ORBEAT_PORTAL_CONNECT_SRC: "http://localhost:8080 http://localhost:8088 http://localhost:8090"
      # Runtime config served at /config.json (fetched by the SPA at boot via
      # loadConfig()) — the same origins baked into the VITE_* build-time
      # fallback, so the containerized path exercises the runtime seam on
      # every run instead of relying on values frozen at image build.
      ORBEAT_PORTAL_API_BASE: "http://localhost:8080"
      ORBEAT_PORTAL_GATEWAY_URL: "http://localhost:8090"
      ORBEAT_PORTAL_OIDC_AUTHORITY: "http://localhost:8088/realms/orbeat"
      ORBEAT_PORTAL_OIDC_CLIENT_ID: "orbeat-portal"
      ORBEAT_PORTAL_MARKETPLACE_SOURCE: "./marketplace"
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "/orbeat-portal", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    # Wait for the api and Keycloak to be HEALTHY (not merely started) — both now
    # have healthchecks, so the portal no longer races them at boot.
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # ── observability (opt-in) ───────────────────────────────────────────────
  # Neither service starts unless `--profile observability` is named, so the
  # default stack is the same six services it has always been. Turning them on
  # is not enough by itself: api and gateway only export when
  # ORBEAT_OTEL_ENDPOINT is set (see their environment blocks).
  #
  # Teardown needs the flag too — `docker compose down -v` WITHOUT it leaves
  # these running and still exits 0. `make down` carries it.
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector:0.132.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    # Deliberately NO published port: api and gateway reach 4317 over the
    # compose network by service name. Publishing it would add host exposure
    # for nothing.
    depends_on:
      - jaeger

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.11.0
    ports:
      # Loopback-bound, matching every other published port in this file
      # (v1.17.0 moved them off 0.0.0.0 after the audit).
      - "127.0.0.1:16686:16686"
