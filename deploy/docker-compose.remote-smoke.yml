# Overlay for scripts/smoke-remote.sh, layered on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.remote-smoke.yml ...
#
# It adds a pushable git:// server and repoints the api's marketplace target at
# it, so the publisher takes the REMOTE path (clone work-dir → fetch/reset →
# push) instead of the default local commit-in-place. This is the only config
# under which the v1.16.1 push-gate fix actually executes.
services:
  gitserver:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gitserver
    # git daemon forks a child per connection. Run it under an init (tini as
    # PID 1) so those children are reaped: as PID 1 itself, git daemon fails to
    # reap and dies with "waitpid ... No child process" once the healthcheck +
    # publisher connections accumulate — reproducible on native Docker (CI),
    # masked by Docker Desktop's VM (dev). Without this the daemon dies after
    # the stop/start cycle and the recovery publish gets connection-refused.
    init: true
    ports:
      - "127.0.0.1:9418:9418" # exposed so the smoke script can clone the remote to assert on its content

  api:
    environment:
      # git:// → isRemote()==true → the fetch/reset/push path runs. Pure-Go
      # transport, so it works against the distroless api image.
      ORBEAT_MARKETPLACE_GIT_URL: "git://gitserver:9418/marketplace.git"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      gitserver:
        condition: service_healthy
